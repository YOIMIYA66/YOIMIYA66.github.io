<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#141B26" />
    </linearGradient>
    <linearGradient id="retinalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="360" fill="url(#bgGrad)" />
  <rect width="720" height="360" fill="none" stroke="#222F43" stroke-width="2" />

  <!-- Top Terminal Header Bar -->
  <rect width="720" height="36" fill="#16202E" />
  <line x1="0" y1="36" x2="720" y2="36" stroke="#26354A" stroke-width="1" />
  <!-- Window dots -->
  <circle cx="18" cy="18" r="4" fill="#EF4444" />
  <circle cx="32" cy="18" r="4" fill="#F59E0B" />
  <circle cx="46" cy="18" r="4" fill="#10B981" />
  <text x="68" y="22" font-family="'Geist Mono', monospace" font-size="11.5" font-weight="600" fill="#94A3B8" letter-spacing="0.05em">VISION_SYS :: DUAL_PERCEPTION_PIPELINE</text>
  <rect x="580" y="8" width="124" height="20" fill="#0369A1" rx="2" />
  <text x="642" y="22" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10.5" font-weight="700" fill="#FFFFFF">AUC 98.4% · &lt;18ms</text>

  <!-- Dividing Line between 2 Sub-Systems -->
  <line x1="360" y1="36" x2="360" y2="360" stroke="#222F43" stroke-width="1" stroke-dasharray="4 3" />

