  <!-- Panel Tag -->
  <rect x="20" y="48" width="138" height="20" fill="#0C2340" stroke="#0284C7" stroke-width="1" />
  <text x="89" y="62" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8">01 · OPHTHALMIC_AI</text>
  <text x="168" y="63" font-family="'Geist Mono', monospace" font-size="11" fill="#64748B">挑战杯国赛一等奖</text>

  <!-- Fundus Eye Scan HUD Circle -->
  <circle cx="105" cy="155" r="54" fill="url(#retinalGlow)" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6 3" />
  <circle cx="105" cy="155" r="42" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <!-- Simulated Retinal Vascular Tree & Optic Disc -->
  <circle cx="85" cy="155" r="14" fill="#F43F5E" fill-opacity="0.3" stroke="#FB7185" stroke-width="1" />
  <path d="M85 155 Q95 140 120 135 M85 155 Q100 160 135 155 M85 155 Q102 175 125 180 M85 155 Q75 142 62 138" stroke="#EF4444" stroke-width="1.8" fill="none" stroke-linecap="round" />
  <!-- Laser Target Reticle on lesion -->
  <rect x="110" y="142" width="18" height="18" fill="none" stroke="#38BDF8" stroke-width="1.2" />
  <line x1="119" y1="138" x2="119" y2="164" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2 2" />
  <line x1="106" y1="151" x2="132" y2="151" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="2 2" />
  <text x="134" y="146" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" fill="#38BDF8">DR: 98.4%</text>

  <!-- Diagnostic Metrics & Probabilities on Right of Retinal Circle -->
  <rect x="180" y="95" width="160" height="120" fill="#111827" stroke="#1F2937" stroke-width="1" />
  <text x="190" y="114" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#94A3B8">MULTI-LABEL DIAGNOSIS</text>
  
  <text x="190" y="136" font-family="'Geist Mono', monospace" font-size="10" fill="#E2E8F0">Diabetic Retinopathy</text>
  <rect x="190" y="142" width="140" height="6" fill="#1F2937" rx="2" />
  <rect x="190" y="142" width="138" height="6" fill="#EF4444" rx="2" />
  <text x="298" y="136" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#F87171">98.4%</text>

  <text x="190" y="166" font-family="'Geist Mono', monospace" font-size="10" fill="#E2E8F0">Glaucoma Screening</text>
  <rect x="190" y="172" width="140" height="6" fill="#1F2937" rx="2" />
  <rect x="190" y="172" width="135" height="6" fill="#10B981" rx="2" />
  <text x="298" y="166" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#34D399">96.8%</text>

  <text x="190" y="196" font-family="'Geist Mono', monospace" font-size="10" fill="#E2E8F0">Macular Degeneration</text>
  <rect x="190" y="202" width="140" height="6" fill="#1F2937" rx="2" />
  <rect x="190" y="202" width="136" height="6" fill="#0284C7" rx="2" />
  <text x="298" y="196" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8">97.2%</text>

  <!-- Bottom Spec Card Left -->
  <rect x="20" y="235" width="320" height="105" fill="#111827" stroke="#1E293B" stroke-width="1" />
  <text x="32" y="256" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#F1F5F9">视网膜病灶细粒度筛查诊断网络</text>
  <text x="32" y="278" font-family="'Geist Mono', monospace" font-size="10" fill="#94A3B8">• 解决细微病灶漏检与临床长尾分布</text>
  <text x="32" y="298" font-family="'Geist Mono', monospace" font-size="10" fill="#94A3B8">• 弱监督病灶精准定位与端侧快速部署</text>
  <text x="32" y="322" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8">STATUS: CERTIFIED · 全国一等奖</text>


