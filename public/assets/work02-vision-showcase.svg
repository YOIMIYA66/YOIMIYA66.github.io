  <rect x="382" y="87" width="158" height="131" fill="#172033" opacity="0.65" />
  <line x1="410" y1="92" x2="395" y2="120" stroke="#94A3B8" stroke-width="1" opacity="0.5" stroke-dasharray="4 6" />
  <line x1="440" y1="92" x2="425" y2="120" stroke="#94A3B8" stroke-width="1" opacity="0.5" stroke-dasharray="4 6" />
  <line x1="480" y1="92" x2="465" y2="120" stroke="#94A3B8" stroke-width="1" opacity="0.5" stroke-dasharray="4 6" />
  <line x1="510" y1="92" x2="495" y2="120" stroke="#94A3B8" stroke-width="1" opacity="0.5" stroke-dasharray="4 6" />
  <text x="400" y="206" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" fill="#94A3B8">RAW: FOG+RAIN (12+ SCENARIOS)</text>

  <!-- Clear recovered boundary line -->
  <line x1="540" y1="87" x2="540" y2="218" stroke="#10B981" stroke-width="1.5" />
  <text x="546" y="206" font-family="'Geist Mono', monospace" font-size="9" font-weight="700" fill="#34D399">DEHAZE / DERAIN ACTIVE</text>

  <!-- Traffic Sign Detection Bounding Box -->
  <rect x="580" y="105" width="70" height="70" fill="none" stroke="#F59E0B" stroke-width="1.8" />
  <!-- Triangular Warning Sign inside -->
  <polygon points="615,116 595,155 635,155" fill="#F59E0B" opacity="0.2" stroke="#F59E0B" stroke-width="1.5" />
  <text x="615" y="148" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="900" fill="#F59E0B">!</text>
  <rect x="580" y="93" width="70" height="14" fill="#F59E0B" />
  <text x="615" y="103" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8.5" font-weight="800" fill="#000000">CONF: 99.1%</text>

  <!-- Bottom Spec Card Right -->
  <rect x="380" y="235" width="320" height="105" fill="#111827" stroke="#1E293B" stroke-width="1" />
  <text x="392" y="256" font-family="'Geist Mono', monospace" font-size="11" font-weight="700" fill="#F1F5F9">物理成像去雾去雨 + INT8 边缘量化</text>
  <text x="392" y="278" font-family="'Geist Mono', monospace" font-size="10" fill="#94A3B8">• 极端天气毫秒级目标检测与暗光补偿</text>
  <text x="392" y="298" font-family="'Geist Mono', monospace" font-size="10" fill="#94A3B8">• 端侧推理延迟 &lt;17.8ms · 精度损耗 &lt;0.5%</text>
  <text x="392" y="322" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" fill="#34D399">STATUS: DEPLOYED · 全国二等奖</text>
</svg>
